<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doc Agent</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

  :root {
    --bg: #FAFAF8;
    --ink: #1A1A1A;
    --muted: #6B6B66;
    --border: #DEDDD7;
    --accent: #3A4B6B;
    --accent-soft: #EEF0F4;
    --error: #A33B2E;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }

  .app {
    width: 100%;
    max-width: 640px;
    padding: 3rem 1.5rem 2rem 1.5rem;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  h1 {
    font-family: 'Source Serif 4', serif;
    font-weight: 600;
    font-size: 1.8rem;
    margin: 0 0 0.3rem 0;
  }

  .subtitle {
    color: var(--muted);
    font-size: 0.9rem;
    margin: 0 0 2rem 0;
    line-height: 1.5;
  }

  .messages {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 1.2rem;
    margin-bottom: 1.5rem;
  }

  .msg-label {
    font-size: 0.75rem;
    color: var(--muted);
    margin-bottom: 0.3rem;
  }

  .bubble {
    border-radius: 6px;
    padding: 0.8rem 1rem;
    font-size: 0.95rem;
    line-height: 1.55;
    white-space: pre-wrap;
  }

  .bubble-user {
    background: #fff;
    border: 1px solid var(--border);
  }

  .bubble-assistant {
    background: var(--accent-soft);
  }

  .bubble-error {
    background: #fdf0ee;
    color: var(--error);
    border: 1px solid #f0d5d0;
  }

  .empty-state {
    color: var(--muted);
    font-size: 0.9rem;
  }

  form {
    display: flex;
    gap: 0.6rem;
    border-top: 1px solid var(--border);
    padding-top: 1.2rem;
  }

  input[type="text"] {
    flex: 1;
    padding: 0.7rem 0.9rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.9rem;
    background: #fff;
    color: var(--ink);
  }

  input[type="text"]:focus {
    outline: none;
    border-color: var(--accent);
  }

  button {
    background: var(--ink);
    color: var(--bg);
    border: 1px solid var(--ink);
    border-radius: 6px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.9rem;
    font-weight: 500;
    padding: 0.7rem 1.2rem;
    cursor: pointer;
    transition: none;
  }

  button:hover:not(:disabled) {
    background: var(--accent);
    border-color: var(--accent);
  }

  button:disabled {
    opacity: 0.5;
    cursor: default;
  }

  .footer-note {
    font-size: 0.72rem;
    color: var(--muted);
    margin-top: 0.6rem;
  }

  .typing {
    color: var(--muted);
    font-size: 0.85rem;
    font-style: italic;
  }

  .mic-btn {
    background: #fff;
    color: var(--ink);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 1rem;
    padding: 0.7rem 0.9rem;
    cursor: pointer;
    transition: none;
  }

  .mic-btn:hover:not(:disabled) {
    border-color: var(--accent);
  }

  .mic-btn.recording {
    background: var(--error);
    color: #fff;
    border-color: var(--error);
  }

  .options-row {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 0.6rem;
  }
</style>
</head>
<body>
  <div class="app">
    <h1>Doc Agent</h1>
    <p class="subtitle">An agent that searches indexed documents, searches the live web, or does math &mdash; whichever a question needs. Type or use the microphone.</p>

    <div class="messages" id="messages">
      <p class="empty-state">Ask something below to get started.</p>
    </div>

    <div class="options-row">
      <input type="checkbox" id="speak-toggle" checked />
      <label for="speak-toggle">Read answers aloud</label>
    </div>

    <form id="ask-form">
      <input type="text" id="question" placeholder="Ask a question..." autocomplete="off" />
      <button type="button" class="mic-btn" id="mic-btn" title="Record a voice question">&#127908;</button>
      <button type="submit" id="send-btn">Send</button>
    </form>
    <p class="footer-note">Answers are generated by an LLM and may be incomplete or wrong.</p>
  </div>

  <script>
    const form = document.getElementById('ask-form');
    const input = document.getElementById('question');
    const messages = document.getElementById('messages');
    const sendBtn = document.getElementById('send-btn');
    const micBtn = document.getElementById('mic-btn');
    const speakToggle = document.getElementById('speak-toggle');
    let emptyStateCleared = false;

    function addBubble(role, text) {
      if (!emptyStateCleared) {
        messages.innerHTML = '';
        emptyStateCleared = true;
      }
      const wrapper = document.createElement('div');
      const label = document.createElement('div');
      label.className = 'msg-label';
      label.textContent = role === 'user' ? 'You' : (role === 'error' ? 'Error' : 'Answer');
      const bubble = document.createElement('div');
      bubble.className = 'bubble ' + (role === 'user' ? 'bubble-user' : role === 'error' ? 'bubble-error' : 'bubble-assistant');
      bubble.textContent = text;
      wrapper.appendChild(label);
      wrapper.appendChild(bubble);
      messages.appendChild(wrapper);
      messages.scrollTop = messages.scrollHeight;
      return bubble;
    }

    function speak(text) {
      if (!speakToggle.checked || !window.speechSynthesis) return;
      window.speechSynthesis.cancel(); // stop any answer still being read
      const utterance = new SpeechSynthesisUtterance(text);
      window.speechSynthesis.speak(utterance);
    }

    async function askQuestion(question) {
      addBubble('user', question);
      sendBtn.disabled = true;

      const typingLabel = document.createElement('p');
      typingLabel.className = 'typing';
      typingLabel.textContent = 'Thinking...';
      messages.appendChild(typingLabel);
      messages.scrollTop = messages.scrollHeight;

      try {
        const res = await fetch('/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question }),
        });
        typingLabel.remove();
        if (!res.ok) {
          addBubble('error', `Request failed (${res.status}). The service may be waking up from idle -- try again in a moment.`);
        } else {
          const data = await res.json();
          addBubble('assistant', data.answer);
          speak(data.answer);
        }
      } catch (err) {
        typingLabel.remove();
        addBubble('error', 'Could not reach the service. It may be waking up from idle -- try again in a moment.');
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const question = input.value.trim();
      if (!question) return;
      input.value = '';
      await askQuestion(question);
    });

    // --- Voice input: record with MediaRecorder, transcribe via /transcribe ---
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;

    micBtn.addEventListener('click', async () => {
      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];

          mediaRecorder.addEventListener('dataavailable', (e) => audioChunks.push(e.data));
          mediaRecorder.addEventListener('stop', async () => {
            stream.getTracks().forEach((track) => track.stop());
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });

            micBtn.textContent = '\u{1F6A9}'; // brief busy indicator while transcribing
            micBtn.disabled = true;

            const formData = new FormData();
            formData.append('file', audioBlob, 'question.webm');

            try {
              const res = await fetch('/transcribe', { method: 'POST', body: formData });
              if (res.ok) {
                const data = await res.json();
                if (data.text && data.text.trim()) {
                  await askQuestion(data.text.trim());
                } else {
                  addBubble('error', "Didn't catch that -- try again.");
                }
              } else {
                addBubble('error', 'Transcription failed. Try again in a moment.');
              }
            } catch (err) {
              addBubble('error', 'Could not reach the transcription service.');
            } finally {
              micBtn.textContent = '\u{1F3A4}';
              micBtn.disabled = false;
            }
          });

          mediaRecorder.start();
          isRecording = true;
          micBtn.classList.add('recording');
          micBtn.title = 'Click to stop recording';
        } catch (err) {
          addBubble('error', 'Microphone access was denied or is unavailable.');
        }
      } else {
        mediaRecorder.stop();
        isRecording = false;
        micBtn.classList.remove('recording');
        micBtn.title = 'Record a voice question';
      }
    });
  </script>
</body>
</html>
